# Baut Netzblick für Windows, macOS und Linux (Tauri, src-tauri/).
# Auslöser:
#   1. Aus dem Release-Workflow: Dateien kommen ans Release, mit Herkunftsnachweis und Prüfsummen.
#   2. Push auf einen Branch desktop/…, oder auf GitHub: Actions → Desktop → Run workflow.
#      Dann nur zum Testen: Dateien liegen unter „Artifacts“ des Laufs.
name: Desktop

on:
  workflow_call:
    inputs:
      tag:
        description: Release, an das die Dateien kommen (leer = nur Artifacts)
        type: string
        default: ''
      version:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      tag:
        description: Bestehendes Release, an das die Dateien kommen (z. B. v1.8.3); leer = nur Artifacts
        type: string
        default: ''
      version:
        description: Leer lassen (Version aus package.json)
        type: string
        default: ''
  push:
    branches: ['desktop/**']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
            dir: src-tauri/target/release/bundle
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            dir: src-tauri/target/universal-apple-darwin/release/bundle
          - name: Linux
            # Älteres Ubuntu, damit das AppImage auch auf älteren Distributionen läuft
            os: ubuntu-22.04
            args: ''
            dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.name }}

      - name: Bibliotheken für Linux
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libdbus-1-dev patchelf

      - run: npm ci

      - name: Unit-Tests
        if: matrix.name == 'Linux'
        run: npm test

      - name: Programm bauen
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version }}
          # Updates im Programm: nur mit Schlüssel (Secrets) und öffentlichem Schlüssel in tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          PUBKEY="$(node -p "(require('./src-tauri/tauri.conf.json').plugins?.updater?.pubkey || '').trim()")"
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$PUBKEY" ]; then
            echo "Mit Update-Dateien (signiert)"
            npx tauri build ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "Ohne Update-Dateien (kein Schlüssel)"
            npx tauri build ${{ matrix.args }}
          fi

      - name: Dateien benennen
        id: files
        shell: bash
        run: |
          V="$(node -p "require('./package.json').version")"
          if [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"; fi
          mkdir out
          B="${{ matrix.dir }}"
          case "${{ matrix.name }}" in
            Windows) cp "$B"/nsis/*-setup.exe "out/Netzblick-$V-Windows-Setup.exe"
                     for f in "$B"/nsis/*-setup.exe.sig; do [ -f "$f" ] && cp "$f" "out/Netzblick-$V-Windows-Setup.exe.sig"; done ;;
            macOS)   cp "$B"/dmg/*.dmg "out/Netzblick-$V-macOS.dmg"
                     if [ -f "$B/macos/Netzblick.app.tar.gz.sig" ]; then
                       cp "$B/macos/Netzblick.app.tar.gz" "out/Netzblick-$V-macOS.app.tar.gz"
                       cp "$B/macos/Netzblick.app.tar.gz.sig" "out/Netzblick-$V-macOS.app.tar.gz.sig"
                     fi ;;
            Linux)   cp "$B"/appimage/*.AppImage "out/Netzblick-$V-Linux-x86_64.AppImage"
                     for f in "$B"/appimage/*.AppImage.sig; do [ -f "$f" ] && cp "$f" "out/Netzblick-$V-Linux-x86_64.AppImage.sig"; done
                     cp "$B"/deb/*.deb "out/netzblick_${V}_amd64.deb" ;;
          esac
          ls -la out

      - name: Herkunftsnachweis (Attestation)
        if: env.TAG != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*

      - uses: actions/upload-artifact@v7
        with:
          name: Netzblick-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

      - name: An das Release hängen
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" out/* --clobber

  checksums:
    name: Prüfsummen
    needs: build
    if: inputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Prüfsummen aller Dateien des Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          mkdir files && cd files
          gh release download "$TAG" --pattern '*' --skip-existing
          rm -f SHA256SUMS.txt latest.json
          # Update-Beschreibung für das Programm (nur wenn signierte Update-Dateien da sind)
          if ls *.sig >/dev/null 2>&1; then
            # Was ist neu: der Teil der Release-Beschreibung vor den Installationshinweisen
            export NOTES="$(gh release view "$TAG" --json body --jq .body || true)"
            python3 - <<'PY'
          import json, os, datetime, re
          tag = os.environ["TAG"]; v = tag.lstrip("v")
          body = os.environ.get("NOTES", "").split("\n### Android")[0]
          body = re.sub(r"\*\*|`", "", body).replace("### ", "").strip()
          notes = body[:900].rsplit("\n", 1)[0] if len(body) > 900 else body
          base = f"https://github.com/{os.environ['GH_REPO']}/releases/download/{tag}/"
          files = {
              "windows-x86_64": f"Netzblick-{v}-Windows-Setup.exe",
              "darwin-aarch64": f"Netzblick-{v}-macOS.app.tar.gz",
              "darwin-x86_64": f"Netzblick-{v}-macOS.app.tar.gz",
              "linux-x86_64": f"Netzblick-{v}-Linux-x86_64.AppImage",
          }
          platforms = {}
          for key, name in files.items():
              if os.path.exists(name + ".sig"):
                  platforms[key] = {"signature": open(name + ".sig").read().strip(), "url": base + name}
          doc = {"version": v, "notes": notes or f"Netzblick {v}", "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"), "platforms": platforms}
          json.dump(doc, open("latest.json", "w"), indent=2)
          print(json.dumps(doc, indent=2)[:2000])
          PY
            gh release upload "$TAG" latest.json --clobber
          fi
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
