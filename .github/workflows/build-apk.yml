# Baut bei jedem Push eine installierbare APK (unter „Actions“ → Lauf → Artifacts)
name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten
        run: npm ci

      - name: Oberfläche bauen und in Android-Projekt kopieren
        run: |
          npm run build
          npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: netzblick-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
