# Erstellt ein GitHub-Release mit den Desktop-Programmen für Windows, macOS und Linux (desktop.yml).
# Signierte APK und AAB (für die Play Console) kommen in einen nicht öffentlichen Entwurf „Android X (privat)“,
# dazu die iPhone-App als unsignierte IPA zum Sideloaden (ios.yml); danach heißt der Entwurf „Android und iPhone X (privat)“.
# Auslöser, jeweils nur wenn es für die Version noch kein Release gibt:
#   1. Neue Version in package.json (und CHANGELOG.md) nach main pushen: Release entsteht automatisch.
#   2. Tag pushen: git tag v1.2.0 && git push origin v1.2.0
#   3. Auf GitHub: Actions → Release → Run workflow (Version aus package.json).
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

# Nie zwei Releases gleichzeitig bauen (z. B. Push auf main und Tag zur selben Zeit).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version prüfen
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - id: v
        name: Version bestimmen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v$PKG"; fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Version muss die Form X.Y.Z haben (ist: $VERSION)"
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          if [ "$VERSION" != "$PKG" ]; then
            echo "::warning::Tag $TAG passt nicht zu package.json ($PKG)."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG gibt es schon, nichts zu tun."
            RELEASE=false
          else
            echo "Neues Release $TAG (versionCode $CODE)"
            RELEASE=true
          fi
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "code=$CODE"
            echo "release=$RELEASE"
          } >> "$GITHUB_OUTPUT"

  release:
    name: Release bauen
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      VERSION_CODE: ${{ needs.version.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci

      - name: Unit-Tests
        run: npm test

      - name: Oberfläche bauen und ins Android-Projekt kopieren
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: |
          npm run build
          npx cap sync android

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Release-Schlüssel hinterlegt (Secret ANDROID_KEYSTORE_BASE64). Es wird mit dem Debug-Schlüssel signiert und als Vorabversion markiert. Siehe docs/RELEASE.md."
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi

      - name: APK und App-Bundle bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace \
            -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"

      - name: Dateien benennen und Prüfsummen erzeugen
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/netzblick-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/netzblick-$VERSION.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release-Notizen aus dem CHANGELOG
        run: node scripts/release-notes.mjs "$VERSION" "$SIGNING" > release-notes.md

      - name: Android privat ablegen (Entwurf, nur für dich sichtbar)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Entwürfe sieht nur, wer Schreibrechte hat. Der Tag entsteht erst beim Veröffentlichen, also nie.
          gh release create "android-$TAG" dist/* \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Android $VERSION (privat)" \
            --notes "APK zum Ausprobieren und App-Bundle (AAB) für die Play Console. Nur für dich sichtbar, nicht veröffentlichen."

      - name: Öffentliches Release anlegen (Desktop-Dateien kommen danach dazu)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          FLAGS=""
          if [ "$SIGNING" = "debug" ]; then FLAGS="--prerelease"; fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Netzblick $VERSION" \
            --notes-file release-notes.md \
            $FLAGS

  desktop:
    name: Desktop-Programm
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
    secrets: inherit
    permissions:
      contents: write
      id-token: write
      attestations: write

  iphone:
    name: iPhone-App
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/ios.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}
    permissions:
      contents: write
