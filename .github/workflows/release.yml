# Erstellt ein GitHub-Release, sobald ein Versions-Tag gepusht wird:
#   git tag v1.0.0
#   git push origin v1.0.0
# Ergebnis unter „Releases“: signierte APK (zum Installieren) und AAB (für den Play Store).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Release bauen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Version aus dem Tag ableiten
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag muss die Form vX.Y.Z haben (ist: $GITHUB_REF_NAME)"
            exit 1
          fi
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Version $VERSION (versionCode $CODE)"

      - run: npm ci

      - name: Unit-Tests
        run: npm test

      - name: Oberfläche bauen und ins Android-Projekt kopieren
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: |
          npm run build
          npx cap sync android

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Release-Schlüssel hinterlegt (Secret ANDROID_KEYSTORE_BASE64). Es wird mit dem Debug-Schlüssel signiert und als Vorabversion markiert. Siehe docs/RELEASE.md."
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi

      - name: APK und App-Bundle bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace \
            -PappVersionName="$VERSION" -PappVersionCode="$VERSION_CODE"

      - name: Dateien benennen und Prüfsummen erzeugen
        run: |
          mkdir dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/netzblick-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/netzblick-$VERSION.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release-Notizen aus dem CHANGELOG
        run: node scripts/release-notes.mjs "$VERSION" "$SIGNING" > release-notes.md

      - name: GitHub-Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          if [ "$SIGNING" = "debug" ]; then FLAGS="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Netzblick $VERSION" \
            --notes-file release-notes.md \
            $FLAGS
