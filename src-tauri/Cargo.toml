[package]
name = "netzblick"
version = "0.0.0" # Die Programmversion kommt aus package.json (siehe tauri.conf.json)
description = "Netzblick für Windows, macOS und Linux"
authors = ["geister-it"]
license = "MIT"
repository = "https://github.com/xionix3/netzblick"
edition = "2021"
rust-version = "1.80"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Anfragen an die Portale gehen direkt vom Programm aus (wie in der Android-App), ohne Umweg über einen Server
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "cookies", "charset", "http2"] }

# Zugangsdaten im Schlüsselbund des Systems (Windows-Anmeldeinformationen, macOS-Schlüsselbund, Linux Secret Service)
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
